<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTDLnis Web</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇️</text></svg>">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="8 12 12 16 16 12"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                    </svg>
                    <h1>YTDLnis Web</h1>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" id="themeToggle" title="Toggle theme">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="input-section">
                <div class="url-input-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                        </svg>
                        <input type="url" id="urlInput" placeholder="Paste video or playlist URL here..." autofocus>
                        <button class="btn-paste" id="pasteBtn" title="Paste from clipboard">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="8" y="2" width="8" height="4" rx="1"/>
                                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                            </svg>
                        </button>
                    </div>
                    <button class="btn-primary" id="fetchBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        Fetch Info
                    </button>
                </div>

                <div class="quick-actions">
                    <button class="btn-secondary" id="quickAudioBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18V5l12-2v13"/>
                            <circle cx="6" cy="18" r="3"/>
                            <circle cx="18" cy="16" r="3"/>
                        </svg>
                        Quick Audio
                    </button>
                    <button class="btn-secondary" id="quickVideoBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="23 7 16 12 23 17 23 7"/>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                        </svg>
                        Quick Video
                    </button>
                </div>
            </section>

            <section class="info-section" id="infoSection" style="display:none;">
                <div class="info-card">
                    <div class="info-thumbnail">
                        <img id="thumbnailImg" src="" alt="Thumbnail">
                    </div>
                    <div class="info-details">
                        <h2 id="videoTitle">Title</h2>
                        <p class="uploader" id="videoUploader">Uploader</p>
                        <div class="info-meta">
                            <span class="meta-item" id="videoDuration"></span>
                            <span class="meta-item" id="videoDate"></span>
                        </div>
                        <p class="description" id="videoDescription"></p>
                    </div>
                </div>

                <div class="download-options">
                    <div class="option-tabs">
                        <button class="tab-btn active" data-type="video">Video</button>
                        <button class="tab-btn" data-type="audio">Audio</button>
                        <button class="tab-btn" data-type="video_only">Video Only</button>
                    </div>

                    <div class="option-content" id="formatOptions">
                        <div class="format-select-group">
                            <label>Quality</label>
                            <select id="formatSelect" class="select-input"></select>
                        </div>
                        <div class="format-select-group" id="audioQualityGroup" style="display:none;">
                            <label>Audio Codec</label>
                            <select id="audioQualitySelect" class="select-input">
                                <option value="mp3">MP3</option>
                                <option value="aac">AAC</option>
                                <option value="m4a">M4A</option>
                                <option value="opus">Opus</option>
                                <option value="flac">FLAC</option>
                                <option value="wav">WAV</option>
                            </select>
                        </div>
                        <div class="format-select-group">
                            <label>Custom Arguments (optional)</label>
                            <input type="text" id="customArgs" class="text-input" placeholder="e.g. --embed-thumbnail --embed-metadata">
                        </div>
                    </div>

                    <button class="btn-download" id="downloadBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download
                    </button>
                </div>
            </section>

            <section class="playlist-section" id="playlistSection" style="display:none;">
                <div class="playlist-header">
                    <h3 id="playlistTitle">Playlist</h3>
                    <span class="playlist-count" id="playlistCount"></span>
                </div>
                <div class="playlist-actions">
                    <button class="btn-secondary btn-sm" id="downloadAllBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download All
                    </button>
                </div>
                <div class="playlist-items" id="playlistItems"></div>
            </section>

            <section class="downloads-section">
                <div class="section-header">
                    <h3>Downloads</h3>
                    <button class="btn-text" id="clearBtn">Clear Completed</button>
                </div>
                <div class="downloads-list" id="downloadsList">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="8 12 12 16 16 12"/>
                            <line x1="12" y1="8" x2="12" y2="16"/>
                        </svg>
                        <p>No downloads yet</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>Powered by yt-dlp &middot; YTDLnis Web</p>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
