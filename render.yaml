services:
  - type: web
    name: ytdlnis-web
    env: python
    buildCommand: mkdir -p ffmpeg && curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz && tar -xf ffmpeg.tar.xz -C ffmpeg --strip-components=1 && rm ffmpeg.tar.xz && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
